[project]
name = "querysolo"
dynamic = ["version"]
description = "Your laptop is the warehouse until it can't be. A local-first lakehouse: Iceberg on Parquet, an Iceberg REST catalog, DuckDB, and a pre-flight gauge."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "QuerySolo contributors" }]
# Runtime dependencies and ceilings follow the brief, D15.
dependencies = [
  "duckdb>=1.5.3,<1.6",
  "dulwich>=1.2,<1.3",
  "pyiceberg[pyarrow]>=0.12,<0.13",
  "pyarrow",
  "sqlalchemy>=2,<3",
  "fastapi",
  "anyio>=4",
  "uvicorn",
  "pydantic>=2,<3",
  "typer",
  "rich",
  "psutil",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# `querysolo run` (dbt through the catalog): `pip install 'querysolo[dbt]'`; a clone's `uv sync`
# has it through the dev group.
dbt = ["dbt-core>=1.12.4,<2", "dbt-duckdb>=1.11.0,<2"]

[project.scripts]
querysolo = "querysolo.cli:run"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx",
  "moto[server]>=5,<6",
  "boto3",
  "ruff",
  "psycopg[binary]>=3.3.5",
  "dbt-core>=1.12.4",
  "dbt-duckdb>=1.11.0",
]

# The frozen core for the installers (ship brief S1): `uv run --group freeze python freeze/build.py`.
freeze = ["pyinstaller>=6.11,<7", "pyinstaller-hooks-contrib>=2025.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "querysolo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["querysolo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
