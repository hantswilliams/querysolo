# The core's test suite on both platforms the brief names (step 0 gate). Every step of
# build-sessions/core-v0.N-plan.md adds its gate test under core/tests/.
name: core

on:
  push:
    branches: [main]
    paths: ['core/**', '.github/workflows/core-ci.yml', 'README.md', 'web/src/data/status.ts', 'web/scripts/gen-readme-status.py']
  pull_request:
    paths: ['core/**', '.github/workflows/core-ci.yml', 'README.md', 'web/src/data/status.ts', 'web/scripts/gen-readme-status.py']
  workflow_dispatch:

jobs:
  readme:
    # README.md's built-versus-planned block is generated from web/src/data/status.ts, the one
    # file the site reads (trust round T7); a stale block fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 web/scripts/gen-readme-status.py --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv sync --locked
      - id: duckdb
        run: echo "version=$(uv run python -c 'import duckdb; print(duckdb.__version__)')" >> "$GITHUB_OUTPUT"
      # The three extensions the brief names (D15, D33), cached per DuckDB version and platform so
      # the suite makes no network fetch after the first run.
      - uses: actions/cache@v5
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}-iceberg-httpfs-excel-aws
      - run: uv run python -c "import duckdb; duckdb.connect().execute('INSTALL iceberg; INSTALL httpfs; INSTALL excel; INSTALL aws')"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  postgres:
    # The second catalog dialect (brief D5) against a service container, so the Postgres
    # variant runs on every push without anyone remembering to start a database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: querysolo
          POSTGRES_PASSWORD: querysolo
          POSTGRES_DB: querysolo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U querysolo -d querysolo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv sync --locked
      - run: uv run pytest tests/test_step1_postgres.py
        env:
          QUERYSOLO_TEST_PG_URL: postgresql+psycopg://querysolo:querysolo@localhost:5432/querysolo
