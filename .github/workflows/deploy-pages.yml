# Builds web/ and publishes it to GitHub Pages on every push to main that touches the site.
#
# One-time setup in the repo: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# (Without it the deploy step fails with "Creating Pages deployment failed ... 404".)
# Private repos need a paid plan for Pages; making the repo public also works.
# Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL             e.g. https://querysolo.dev   — set this when a custom domain is configured
#                        (also add the domain under Settings → Pages). Unset = https://<owner>.github.io/<repo>
#   PUBLIC_WAITLIST_URL  REQUIRED for the waitlist to capture anything. Today:
#                        https://formspree.io/f/meaqdnjv  (a form id is not a secret -- Astro
#                        inlines PUBLIC_ vars into the browser bundle -- so this is a variable.)
#                        Unset = the forms tell visitors signups are not open; they never fake
#                        success. GitHub Pages can't run functions/api/waitlist.ts; that one is
#                        for Cloudflare Pages.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5     # fails early with a clear message if Pages isn't enabled
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Warn if the waitlist has nowhere to post
        if: ${{ !vars.PUBLIC_WAITLIST_URL }}
        run: |
          echo "::warning title=Waitlist not configured::PUBLIC_WAITLIST_URL is unset, so this deploy captures no signups. The forms will tell visitors signups are not open (they never fake success -- see web/TASKS.md item 1). Set the repo variable to https://formspree.io/f/meaqdnjv under Settings -> Secrets and variables -> Actions -> Variables."
      - run: npm ci
      - run: npm run build
        env:
          # Custom domain → serve from "/". Otherwise → https://<owner>.github.io/<repo>/
          SITE_URL:  ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          SITE_BASE: ${{ vars.SITE_URL && '/' || format('/{0}', github.event.repository.name) }}
          PUBLIC_WAITLIST_URL: ${{ vars.PUBLIC_WAITLIST_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
