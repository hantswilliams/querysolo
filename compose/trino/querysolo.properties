# Trino against QuerySolo's catalog (the `catalog` compose service) and the RustFS warehouse.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://catalog:8181
iceberg.rest-catalog.warehouse=s3://querysolo-test/smoke
iceberg.rest-catalog.security=NONE
iceberg.file-format=PARQUET
fs.native-s3.enabled=true
s3.endpoint=http://s3:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=querysolo
s3.aws-secret-key=querysoloquerysolo
